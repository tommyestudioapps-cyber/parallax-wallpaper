name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências do monorepo
        run: pnpm install

      - name: Dar permissão ao gradlew
        working-directory: artifacts/parallax-wallpaper/android
        run: chmod +x gradlew

      - name: Compilar APK (release)
        working-directory: artifacts/parallax-wallpaper/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: parallax-apk
          path: artifacts/parallax-wallpaper/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
