name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências do monorepo
        run: pnpm install --no-frozen-lockfile --config.strict-dep-builds=false

      - name: Gerar pasta android com Expo prebuild
        working-directory: artifacts/parallax-wallpaper
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Dar permissão ao gradlew
        working-directory: artifacts/parallax-wallpaper/android
        run: chmod +x gradlew

      - name: Configurar chave de release oficial (keystore)
        working-directory: artifacts/parallax-wallpaper/android/app
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -storepass tommy123456 \
            -alias parallaxkey \
            -keypass tommy123456 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Tommy Studio Apps,OU=Mobile,O=Tommy Studio,L=Curitiba,ST=PR,C=BR"

      - name: Configurar assinatura de release no build.gradle
        working-directory: artifacts/parallax-wallpaper/android/app
        run: |
          python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path('build.gradle')
          s = p.read_text()

          # Adicionar bloco de assinatura de release
          target_signing = "    signingConfigs {\n"
          release_signing = "    signingConfigs {\n        release {\n            storeFile file('release.keystore')\n            storePassword 'tommy123456'\n            keyAlias 'parallaxkey'\n            keyPassword 'tommy123456'\n        }\n"
          if target_signing in s and "release {" not in s:
              s = s.replace(target_signing, release_signing, 1)

          # Trocar signingConfig do release de debug para release
          target_buildtype = "        release {\n            // Caution! In production, you need to generate your own keystore file.\n            // see https://reactnative.dev/docs/signed-apk-android.\n            signingConfig signingConfigs.debug"
          replacement_buildtype = "        release {\n            signingConfig signingConfigs.release"
          if target_buildtype in s:
              s = s.replace(target_buildtype, replacement_buildtype, 1)
          else:
              s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")

          p.write_text(s)
          print("build.gradle assinado com release.keystore com sucesso")
          PYEOF

      - name: Compilar APK e AAB Bundle (release)
        working-directory: artifacts/parallax-wallpaper/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: parallax-apk
          path: artifacts/parallax-wallpaper/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publicar AAB (Google Play Store Bundle) como artefato
        uses: actions/upload-artifact@v4
        with:
          name: parallax-release-aab
          path: artifacts/parallax-wallpaper/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
